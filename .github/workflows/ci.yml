name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m unittest discover -s tests -v
      - run: python scripts/audit_repository.py
      - name: Compile and validate examples
        run: |
          python skills/drawio-diagram-engineer/scripts/drawio_tool.py \
            compile skills/drawio-diagram-engineer/assets/example.architecture.json \
            -o /tmp/architecture.drawio
          python skills/drawio-diagram-engineer/scripts/drawio_tool.py \
            validate /tmp/architecture.drawio --strict
          python skills/drawio-diagram-engineer/scripts/drawio_tool.py \
            compile skills/drawio-diagram-engineer/assets/example.multipage.json \
            -o /tmp/multipage.drawio
          python skills/drawio-diagram-engineer/scripts/drawio_tool.py \
            validate /tmp/multipage.drawio --strict
          python skills/drawio-diagram-engineer/scripts/drawio_tool.py \
            preview skills/drawio-diagram-engineer/assets/example.multipage.json \
            --page context -o /tmp/context.svg
          python skills/drawio-diagram-engineer/scripts/drawio_tool.py \
            blueprint skills/drawio-diagram-engineer/assets/example.blueprint.json \
            -o /tmp/blueprint.drawio \
            --ir-output /tmp/blueprint.diagram.json \
            --preview-dir /tmp/blueprint-previews \
            --strict
          python skills/drawio-diagram-engineer/scripts/drawio_tool.py \
            audit skills/drawio-diagram-engineer/assets/example.blueprint.json \
            -o /tmp/blueprint.audit.json \
            --preview-dir /tmp/blueprint-audit-previews \
            --theme-file skills/drawio-diagram-engineer/assets/themes/corporate.json \
            --strict
          python skills/drawio-diagram-engineer/scripts/drawio_tool.py \
            erd skills/drawio-diagram-engineer/assets/example.erd.json \
            -o /tmp/commerce-erd.drawio \
            --ir-output /tmp/commerce-erd.diagram.json \
            --preview-dir /tmp/commerce-erd-previews \
            --theme-file skills/drawio-diagram-engineer/assets/themes/corporate.json \
            --strict
          python skills/drawio-diagram-engineer/scripts/drawio_tool.py \
            ha skills/drawio-diagram-engineer/assets/example.ha.json \
            -o /tmp/checkout-ha.drawio \
            --ir-output /tmp/checkout-ha.diagram.json \
            --preview-dir /tmp/checkout-ha-previews \
            --theme-file skills/drawio-diagram-engineer/assets/themes/corporate.json \
            --strict
          python skills/drawio-diagram-engineer/scripts/drawio_tool.py \
            import skills/drawio-diagram-engineer/assets/example.terraform.tf \
            --type terraform -o /tmp/terraform.diagram.json
          python skills/drawio-diagram-engineer/scripts/drawio_tool.py \
            compile /tmp/terraform.diagram.json -o /tmp/terraform.drawio
          python skills/drawio-diagram-engineer/scripts/drawio_tool.py \
            validate /tmp/terraform.drawio --strict
          python skills/drawio-diagram-engineer/scripts/drawio_tool.py \
            import skills/drawio-diagram-engineer/assets/example.kubernetes.json \
            --type kubernetes -o /tmp/kubernetes.diagram.json
          python skills/drawio-diagram-engineer/scripts/drawio_tool.py \
            compile /tmp/kubernetes.diagram.json -o /tmp/kubernetes.drawio
          python skills/drawio-diagram-engineer/scripts/drawio_tool.py \
            validate /tmp/kubernetes.drawio --strict
          python skills/drawio-diagram-engineer/scripts/drawio_tool.py \
            import skills/drawio-diagram-engineer/assets/example.github-actions.json \
            --type github-actions -o /tmp/github-actions.diagram.json
          python skills/drawio-diagram-engineer/scripts/drawio_tool.py \
            import skills/drawio-diagram-engineer/assets/example.gitlab-ci.json \
            --type gitlab-ci -o /tmp/gitlab-ci.diagram.json
          python skills/drawio-diagram-engineer/scripts/drawio_tool.py \
            diff skills/drawio-diagram-engineer/assets/example.drift.before.json \
            skills/drawio-diagram-engineer/assets/example.drift.after.json \
            -o /tmp/drift.report.json \
            --diagram-output /tmp/drift.drawio \
            --preview-dir /tmp/drift-previews
          python skills/drawio-diagram-engineer/scripts/drawio_tool.py \
            validate /tmp/drift.drawio --strict
          python skills/drawio-diagram-engineer/scripts/drawio_tool.py \
            compile skills/drawio-diagram-engineer/assets/example.routing.json \
            -o /tmp/routing.drawio
          python skills/drawio-diagram-engineer/scripts/drawio_tool.py \
            audit skills/drawio-diagram-engineer/assets/example.routing.json \
            -o /tmp/routing.audit.json \
            --preview-dir /tmp/routing-previews \
            --strict
