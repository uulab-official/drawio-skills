name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  id-token: write
  attestations: write
  artifact-metadata: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
      - name: Test and audit
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python scripts/verify_release_tag.py "$RELEASE_TAG"
          python -m unittest discover -s tests -v
          python scripts/audit_repository.py
      - name: Package
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          VERSION="${RELEASE_TAG#v}"
          python scripts/package_skill.py \
            -o "dist/drawio-diagram-engineer-${VERSION}.zip"
          cd dist
          sha256sum -c "drawio-diagram-engineer-${VERSION}.zip.sha256"
      - name: Attest release ZIP
        uses: actions/attest@36051bcae73b7c2a8a6945a48cbf80953c6baa35 # v4
        with:
          subject-path: "dist/*.zip"
      - name: Upload workflow artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: drawio-diagram-engineer-${{ github.ref_name }}
          path: |
            dist/*.zip
            dist/*.sha256
          if-no-files-found: error
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release create "$RELEASE_TAG" dist/* \
            --draft \
            --verify-tag \
            --generate-notes \
            --title "$RELEASE_TAG"
          gh release edit "$RELEASE_TAG" --draft=false
