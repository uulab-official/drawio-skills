name: Diagram Review Pages

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "architecture/**"
      - "skills/drawio-diagram-engineer/**"

permissions:
  contents: read
  pages: write
  id-token: write
  security-events: write

concurrency:
  group: diagram-review-pages
  cancel-in-progress: false

env:
  DIAGRAM_SOURCE: architecture/system.json
  ORGANIZATION_POLICY: architecture/policies/organization.json
  TEAM_POLICY: architecture/policies/team.json
  REVIEW_OWNERSHIP: architecture/review-ownership.json

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out the immutable source revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"

      - name: Configure GitHub Pages
        id: pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b

      - name: Resolve the deterministic policy date
        run: echo "POLICY_DATE=$(git show -s --format=%cs "$GITHUB_SHA")" >> "$GITHUB_ENV"

      - name: Build the diagram evidence bundle
        run: |
          python skills/drawio-diagram-engineer/scripts/drawio_tool.py \
            build "$DIAGRAM_SOURCE" \
            -o "${RUNNER_TEMP}/diagram-bundle" \
            --strict

      - name: Publish and enforce architecture policy
        run: |
          python skills/drawio-diagram-engineer/scripts/drawio_tool.py \
            publish "${RUNNER_TEMP}/diagram-bundle" \
            -o "${RUNNER_TEMP}/diagram-review" \
            --policy "$ORGANIZATION_POLICY" \
            --policy "$TEAM_POLICY" \
            --ownership "$REVIEW_OWNERSHIP" \
            --evaluation-date "$POLICY_DATE" \
            --source-revision "$GITHUB_SHA" \
            --source-repository "$GITHUB_REPOSITORY" \
            --source-url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/commit/$GITHUB_SHA" \
            --public-base-url "${{ steps.pages.outputs.base_url }}" \
            --fail-on-policy \
            --fail-on-unowned-findings \
            --strict

      - name: Publish the architecture check summary
        if: always()
        run: |
          if [ -f "${RUNNER_TEMP}/diagram-review/reports/summary.md" ]; then
            cat "${RUNNER_TEMP}/diagram-review/reports/summary.md" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Architecture review publication did not produce a summary." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload findings to code scanning
        uses: github/codeql-action/upload-sarif@4187e74d05793876e9989daffde9c3e66b4acd07
        with:
          sarif_file: ${{ runner.temp }}/diagram-review/reports/findings.sarif
          category: drawio-architecture-review

      - name: Retain an immutable review artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: diagram-review-${{ github.sha }}
          path: ${{ runner.temp }}/diagram-review
          if-no-files-found: error
          overwrite: false
          retention-days: 30

      - name: Upload the Pages artifact
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa
        with:
          path: ${{ runner.temp }}/diagram-review

      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e
